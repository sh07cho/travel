<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>빅아일랜드 여행 지도</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){document.documentElement.dataset.theme='light'}</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --lava:#000000;
    --sand:#faf6ef;
    --ocean:#0e7490;
    --sunset:#ea580c;
    --palm:#166534;
    --ink:#292524;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#000}
  #app{display:flex;flex-direction:column;height:100%;height:100dvh}

  header{background:var(--lava);color:var(--sand);padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
  .title-row{display:flex;align-items:baseline;gap:8px;padding-bottom:8px}
  h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
  .sub{font-size:12px;opacity:.55}
  .hbtn{align-self:center;background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:50%;
        width:32px;height:32px;font-size:15px;line-height:1;cursor:pointer;font-family:inherit}
  .hbtn:active{background:rgba(255,255,255,.28)}
  #theme{margin-left:auto}
  #refresh{margin-left:8px}

  nav{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;background:var(--lava);scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;border:none;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;
       background:rgba(255,255,255,.09);color:rgba(255,255,255,.75);cursor:pointer;line-height:1.2;font-family:inherit}
  .tab small{display:block;font-size:10px;font-weight:400;opacity:.7}
  .tab.on{background:var(--day,var(--sand));color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35)}

  #map{flex:1;min-height:0;z-index:0}
  .leaflet-container{font-family:inherit}

  /* numbered pin */
  .pin{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50% 50% 50% 4px;
       transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
  .pin span{transform:rotate(45deg);color:#fff;font-size:13px;font-weight:800}

  /* always-visible base pins (숙소/코스트코) */
  .base-pin{background:#111;color:#fff;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;
            border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5);white-space:nowrap;width:max-content;
            transform:translate(-50%,-50%);line-height:1.3}

  .popup-time{font-size:11px;font-weight:700;color:var(--sunset);letter-spacing:.5px}
  .popup-name{font-size:14px;font-weight:700;margin:2px 0 4px;color:var(--ink)}
  .popup-note{font-size:12px;color:#57534e;line-height:1.45}
  .popup-go, .leaflet-container a.popup-go{display:inline-block;margin-top:8px;margin-right:6px;padding:7px 12px;
            border-radius:8px;background:var(--ocean);color:#fff;font-size:12.5px;font-weight:700;text-decoration:none}
  .leaflet-container a.popup-info{background:#efe9dd;color:var(--ink);margin-right:0}

  /* bottom stop list */
  #sheet{position:relative;z-index:2;background:var(--sand);margin-top:-14px;border-radius:16px 16px 0 0;
         box-shadow:0 -6px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;height:46dvh}
  #grab{flex:0 0 auto;height:22px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab}
  #grab::before{content:'';width:38px;height:5px;border-radius:999px;background:#d6cdb8}
  #scroll{flex:1;min-height:0;position:relative;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #sheetbody{position:relative;background:var(--sand);min-height:100%;
             padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
  .stop{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;cursor:pointer;position:relative}
  .stop:active{background:#f1ebdf}
  .stop.home-row{background:#f4efe4}
  .stop::before,.leg::before{content:'';position:absolute;left:27px;top:0;bottom:0;width:2px;background:#e6ded0;z-index:0}
  .stop:first-child::before{top:23px}
  .stop:last-child::before{height:23px;bottom:auto}
  .stop-num{flex:0 0 24px;height:24px;border-radius:50%;color:#fff;font-size:12px;font-weight:800;
            display:flex;align-items:center;justify-content:center;margin-top:1px;position:relative;z-index:1;box-shadow:0 0 0 3px var(--sand)}
  .stop-body{min-width:0}
  .stop-time{font-size:11px;font-weight:700;color:var(--sunset)}
  .stay{color:#a8a29e;font-weight:600;font-size:.92em}
  .stop-name{font-size:14px;font-weight:600;color:var(--ink);margin:1px 0}
  .stop-note{font-size:11.5px;color:#78716c;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .leg{position:relative;padding:4px 0 4px 52px;font-size:11px;font-weight:700;color:#a8a29e}
  .leg.home-leg{color:var(--ink);font-weight:800}

  /* map controls & route */
  .route-btn{background:var(--sand);color:var(--ink);border:none;border-radius:10px;padding:8px 12px;
             font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .route-btn.off{background:rgba(28,25,23,.82);color:rgba(255,255,255,.85)}
  .loc-btn{background:var(--sand);color:var(--ink);border:none;border-radius:10px;width:38px;height:38px;
           font-size:17px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
  .loc-btn.busy{opacity:.55}
  .me-dot{width:16px;height:16px;border-radius:50%;background:#3b82f6;border:2.5px solid #fff;
          box-shadow:0 0 0 rgba(59,130,246,.5);animation:mepulse 2s infinite}
  @keyframes mepulse{0%{box-shadow:0 0 0 0 rgba(59,130,246,.5)}70%{box-shadow:0 0 0 13px rgba(59,130,246,0)}100%{box-shadow:0 0 0 0 rgba(59,130,246,0)}}
  .leg-badge{background:#fff;border:1.5px solid rgba(0,0,0,.15);border-radius:999px;padding:1px 7px;font-size:11px;
             font-weight:800;color:var(--ink);white-space:nowrap;width:max-content;transform:translate(-50%,-50%);
             box-shadow:0 1px 4px rgba(0,0,0,.3)}

  /* 다크모드 — 우상단 토글(초기값: 저장값 or 기기설정) */
  [data-theme="dark"] #sheet, [data-theme="dark"] #sheetbody{background:#1b1714}
  [data-theme="dark"] #grab::before{background:#3a352d}
  [data-theme="dark"] .stop.home-row{background:#241f19}
  [data-theme="dark"] .stop:active{background:#26221c}
  [data-theme="dark"] .stop::before,[data-theme="dark"] .leg::before{background:#37322a}
  [data-theme="dark"] .stop-num{box-shadow:0 0 0 3px #1b1714}
  [data-theme="dark"] .stop-name{color:#f2ece0}
  [data-theme="dark"] .stop-note{color:#a8a29e}
  [data-theme="dark"] .leg{color:#8a847a}
  [data-theme="dark"] .route-btn{background:#2a2520;color:#f2ece0}
  [data-theme="dark"] .loc-btn{background:#2a2520;color:#f2ece0}
  [data-theme="dark"] .leaflet-popup-content-wrapper,[data-theme="dark"] .leaflet-popup-tip{background:#221e19;color:#f2ece0}
  [data-theme="dark"] .popup-name{color:#f2ece0}
  [data-theme="dark"] .popup-note{color:#b8b2a8}
  [data-theme="dark"] .leaflet-container a.popup-info{background:#332d26;color:#f2ece0}
</style>
</head>

// 내 위치
let meMarker=null, meCircle=null, locBtn=null;
function showMe(lat,lng,acc){
  if(meMarker) meMarker.setLatLng([lat,lng]);
  else meMarker=L.marker([lat,lng],{interactive:false,zIndexOffset:2000,
    icon:L.divIcon({className:'',iconSize:[18,18],iconAnchor:[9,9],html:'<div class="me-dot"></div>'})}).addTo(map);
  if(meCircle) meCircle.setLatLng([lat,lng]).setRadius(acc);
  else meCircle=L.circle([lat,lng],{radius:acc,color:'#1d4ed8',weight:1,opacity:.4,
    fillColor:'#3b82f6',fillOpacity:.12,interactive:false}).addTo(map);
}
function locate(fly,manual){
  if(!navigator.geolocation){ if(manual) alert('이 브라우저는 위치를 지원하지 않아요.'); return; }
  if(locBtn) locBtn.classList.add('busy');
  navigator.geolocation.getCurrentPosition(
    p=>{ locBtn&&locBtn.classList.remove('busy');
      const c=p.coords; showMe(c.latitude,c.longitude,c.accuracy);
      if(fly) map.setView([c.latitude,c.longitude], Math.max(map.getZoom(),14),{animate:true}); },
    e=>{ locBtn&&locBtn.classList.remove('busy');
      if(manual) alert('위치를 가져올 수 없어요. 브라우저 위치 권한을 확인해 주세요.'); },
    {enableHighAccuracy:true, timeout:10000, maximumAge:5000}
  );
}
const LocateControl = L.Control.extend({
  options:{position:'topleft'},
  onAdd(){
    const b=L.DomUtil.create('button','loc-btn');
    b.textContent='📍'; b.title='내 위치';
    locBtn=b;
    L.DomEvent.on(b,'click',L.DomEvent.stop).on(b,'click',()=>locate(true,true));
    return b;
  }
});
map.addControl(new LocateControl());

function defaultDay(){
  const today = new Date();
  const trip = new Date(2026,6,10); // Jul 10 2026
  const diff = Math.floor((today - trip)/86400000);
  return Math.min(Math.max(diff,0),8);
}

function pinIcon(color,num){
  return L.divIcon({
    className:'', iconSize:[30,30], iconAnchor:[15,28], popupAnchor:[0,-26],
    html:`<div class="pin" style="background:${color}"><span>${num}</span></div>`
  });
}

function legInfo(a,b){
  const R=6371, rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
  const straight=2*R*Math.asin(Math.sqrt(h));    // 직선 km
  const walk = straight < 1.0;                    // 1km 미만 = 도보권
  const min = walk
    ? Math.max(2, Math.round(straight/4.5*60))    // 도보 4.5km/h
    : Math.max(3, Math.round(straight*1.3/65*60/5)*5); // 차 65km/h, 굽이 1.3배, 5분 단위
  return {walk, min, icon: walk?'🚶':'🚗'};
}
function fmtMin(m){
  if(m<60) return `${m}분`;
  const h=Math.floor(m/60), mm=m%60;
  return mm ? `${h}시간 ${mm}분` : `${h}시간`;
}
function parseT(t){
  const m=String(t).trim().match(/(\d+):(\d+)\s*(AM|PM)/i);
  if(!m) return null;
  let h=(+m[1])%12; if(/pm/i.test(m[3])) h+=12;
  return h*60 + (+m[2]);
}
function fmtT(mins){
  mins=((Math.round(mins)%1440)+1440)%1440;
  const h=Math.floor(mins/60), mm=mins%60, ap=h>=12?'PM':'AM', h12=h%12||12;
  return `${h12}:${String(mm).padStart(2,'0')} ${ap}`;
}
// 도착 – 출발 (체류) 표시. 출발 = 다음 도착 − 이동시간
function setRange(el, arr, nextArr, drive){
  if(el==null||arr==null||nextArr==null) return;
  let dep=nextArr-drive; if(dep<arr) dep=arr;
  const stay=dep-arr;
  el.innerHTML = `${fmtT(arr)} – ${fmtT(dep)}` + (stay>=3?` <span class="stay">(${fmtMin(stay)})</span>`:'');
}
function badge(pos,html){
  return L.marker(pos,{interactive:false,zIndexOffset:500,
    icon:L.divIcon({className:'',iconSize:[0,0],html:`<div class="leg-badge">${html}</div>`})});
}
// 구간 그리기: 즉시 직선(추정)으로 그린 뒤, 자동차 구간은 OSRM 실도로로 교체
async function drawLeg(a,b,color,g,legEl,idx,gen,prefix,fixedMin,timeEl,arrMin,nextArrMin){
  prefix = prefix || '';
  const straight=L.polyline([[a.lat,a.lng],[b.lat,b.lng]],
    g.walk ? {color:'#292524',weight:3,opacity:.85,dashArray:'2,8',lineCap:'round'}
           : {color,weight:4,opacity:.7});
  straight.addTo(routeLayer);
  if(g.walk) return;                          // 도보는 실도로 라우팅 안 함

  const key=`${a.lng},${a.lat};${b.lng},${b.lat}`;
  try{
    let rt=legCache[key];
    if(!rt){
      await new Promise(r=>setTimeout(r,idx*250));   // 공개서버 배려용 약간의 간격
      if(gen!==renderGen) return;
      const url=`https://router.project-osrm.org/route/v1/driving/${key}?overview=full&geometries=geojson`;
      const res=await fetch(url); if(!res.ok) throw 0;
      const j=await res.json(); rt=j.routes&&j.routes[0]; if(!rt) throw 0;
      legCache[key]=rt;
    }
    if(gen!==renderGen) return;               // 그새 탭이 바뀜 → 폐기
    const line=rt.geometry.coordinates.map(c=>[c[1],c[0]]);
    const m=Math.max(1, rt.duration/60);
    const disp=fixedMin||(m<15?Math.round(m):Math.round(m/5)*5);
    routeLayer.removeLayer(straight);
    L.polyline(line,{color,weight:4,opacity:.85}).addTo(routeLayer);
    if(legEl) legEl.textContent=`${prefix}🚗 ${fmtMin(disp)}`;
    if(timeEl) setRange(timeEl, arrMin, nextArrMin, disp);   // 실도로 시간으로 도착–출발 갱신
  }catch(e){ /* 실패 시 직선 추정 유지 */ }
}
// 길찾기: 좌표가 정확한 스톱은 좌표로 직행(정밀). dest(주소/상호)가 있으면 그걸로 — 추정 좌표 보정용
function gmaps(s){
  const d = s.dest ? encodeURIComponent(s.dest) : `${s.lat},${s.lng}`;
  return `https://www.google.com/maps/dir/?api=1&destination=${d}`;
}
function ginfo(s){
  const q = s.dest ? encodeURIComponent(s.dest) : encodeURIComponent(s.n.replace(/\s*\([^)]*\)/g,'').trim());
  return `https://www.google.com/maps/search/${q}/@${s.lat},${s.lng},16z`;
}

function render(i,keepView){
  cur = i;
  const gen = ++renderGen;
  document.querySelectorAll('.tab').forEach((b,j)=>b.classList.toggle('on', j===i));
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  routeLayer.clearLayers();
  const day = DAYS[i], color = DAY_COLORS[i];
  document.documentElement.style.setProperty('--day', color);  // 그날 테마색
  const sheet = document.getElementById('sheetbody');
  sheet.innerHTML = '';
  const bounds = [];
  const home = HOME;
  // 매일 0번 = 숙소(출발). 도착일(7/10)은 공항에서 오므로 0번 없음
  const hasHome = i!==0 && day.depart;
  const list = hasHome
    ? [{t:day.depart, n:"숙소 (출발)", m:day.prep, lat:home.lat, lng:home.lng, dest:home.dest, isHome:true}].concat(day.stops)
    : day.stops.slice();
  list.forEach((s,idx)=>{
    const num = hasHome ? idx : idx+1;      // 숙소=0, 방문지=1..N
    const label = s.isHome ? '🏠' : num;    // 숙소는 집 이모지로 표시
    const mk = L.marker([s.lat,s.lng],{icon:pinIcon(color,label), zIndexOffset:s.isHome?800:0}).addTo(map);
    mk.bindPopup(`<div class="popup-time">${s.t}</div><div class="popup-name">${s.n}</div>
      <div class="popup-note">${s.m}</div>
      <a class="popup-go" href="${gmaps(s)}" target="_blank">🚗 길찾기</a><a class="popup-go popup-info" href="${ginfo(s)}" target="_blank">ℹ️ 구글 정보보기</a>`);
    markers.push(mk); bounds.push([s.lat,s.lng]);
    const row = document.createElement('div');
    row.className = 'stop' + (s.isHome?' home-row':'');
    row.innerHTML = `<div class="stop-num" style="background:${color}">${label}</div>
      <div class="stop-body"><div class="stop-time">${s.t}</div>
      <div class="stop-name">${s.n}</div><div class="stop-note">${s.m}</div></div>`;
    row.onclick = ()=>{ map.setView([s.lat,s.lng],13,{animate:true}); mk.openPopup(); };
    sheet.appendChild(row);
    const timeEl = row.querySelector('.stop-time');
    const next = list[idx+1];
    if(s.isHome) timeEl.innerHTML = `${s.t} <span class="stay">출발</span>`;
    else if(!next) timeEl.textContent = s.t;   // 마지막 지점: 도착만
    if(next){
      const g = legInfo(s,next);
      const fixed = (s.isHome && next.fromHome) ? next.fromHome : undefined;
      if(fixed) g.min = fixed;
      if(!s.isHome) setRange(timeEl, parseT(s.t), parseT(next.t), g.min);   // 도착–출발(체류)
      const leg = document.createElement('div');
      leg.className='leg';
      leg.textContent = `${g.icon} 약 ${fmtMin(g.min)}`;
      sheet.appendChild(leg);
      if(routeOn) drawLeg(s,next,color,g,leg,idx,gen,'',fixed, (s.isHome?null:timeEl), parseT(s.t), parseT(next.t));
    }
  });
  if(!keepView) map.fitBounds(bounds,{padding:[36,36],maxZoom:12});
}

const tabs = document.getElementById('tabs');
DAYS.forEach((day,i)=>{

  b.onclick = ()=>render(i);
  tabs.appendChild(b);
});

    sync();

// 하단 시트: 핸들 드래그로 펼치기(스냅 3단계)
(function(){
  const sheet=document.getElementById('sheet');
  const grab=document.getElementById('grab');
  const SNAPS=[0.16,0.46,0.84];
  let snapIdx=1;
  const H=()=>window.innerHeight;
  function setH(px,anim){ sheet.style.transition=anim?'height .25s cubic-bezier(.4,0,.2,1)':'none'; sheet.style.height=px+'px'; }
  function snapTo(k){ snapIdx=Math.max(0,Math.min(SNAPS.length-1,k)); setH(SNAPS[snapIdx]*H(),true); setTimeout(()=>map.invalidateSize(),260); }
  snapTo(1);
  window.addEventListener('resize',()=>setH(SNAPS[snapIdx]*H(),false));
  let gY=null,gH=0,moved=0;
  grab.addEventListener('touchstart',e=>{ gY=e.touches[0].clientY; gH=sheet.offsetHeight; moved=0; sheet.style.transition='none'; },{passive:true});
  grab.addEventListener('touchmove',e=>{
    if(gY===null) return;
    const dy=gY-e.touches[0].clientY; moved=Math.max(moved,Math.abs(dy));
    const h=Math.max(SNAPS[0]*H()-30, Math.min(SNAPS[SNAPS.length-1]*H()+30, gH+dy));
    sheet.style.height=h+'px';
    if(e.cancelable) e.preventDefault();
  },{passive:false});
  grab.addEventListener('touchend',()=>{
    if(gY===null) return;
    if(moved<8){ snapTo((snapIdx+1)%SNAPS.length); gY=null; return; }   // 탭 = 다음 단계
    const cur=sheet.offsetHeight/H(); let best=0,bd=9;
    SNAPS.forEach((v,k)=>{ const d=Math.abs(v-cur); if(d<bd){bd=d;best=k;} });
    snapTo(best); gY=null;
  });
})();
</script>
